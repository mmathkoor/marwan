<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>مدير أموالي - النظام المتكامل</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2f5; }

/* شاشة التحميل */
.loader { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; display: none; justify-content: center; align-items: center; flex-direction: column; }
.loader.show { display: flex; }
.spinner { width: 45px; height: 45px; border: 3px solid rgba(255,255,255,0.2); border-top-color: #0d9488; border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* نافذة منبثقة */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 9000; display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); }
.modal.show { display: flex; }
.modal-box { background: white; width: 100%; max-width: 500px; border-radius: 30px 30px 0 0; padding: 24px 20px 32px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* شريط سفلي */
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.97); backdrop-filter: blur(10px); border-top: 1px solid #e5e7eb; padding: 8px 16px 20px; z-index: 100; }
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: all 0.2s; }
.nav-item.active .nav-icon { background: #0d9488; color: white; transform: translateY(-8px); }
.nav-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #6b7280; transition: all 0.3s; }

/* بطاقات */
.card { background: white; border-radius: 24px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }

/* أزرار */
.btn { padding: 14px; border-radius: 16px; font-weight: bold; text-align: center; cursor: pointer; transition: all 0.2s; }
.btn:active { transform: scale(0.97); }

/* شريط تقدم */
.progress { height: 8px; background: #e5e7eb; border-radius: 10px; overflow: hidden; }
.progress-fill { height: 100%; background: #0d9488; border-radius: 10px; transition: width 0.3s; }

/* عنصر الحركة */
.trans-item { background: #f9fafb; border-radius: 16px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

/* فلتر */
.filter-chip { display: inline-block; padding: 6px 14px; background: #f3f4f6; border-radius: 30px; font-size: 13px; margin: 4px; cursor: pointer; }
.filter-chip.active { background: #0d9488; color: white; }

/* رسم بياني */
.chart-container { height: 200px; position: relative; margin: 16px 0; }

/* إشعار */
.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #0d9488; color: white; padding: 12px 24px; border-radius: 40px; font-weight: bold; z-index: 10000; animation: fadeUp 0.3s; }
@keyframes fadeUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>
</head>
<body>

<!-- شاشة تحميل -->
<div id="loader" class="loader"><div class="spinner"></div><p class="text-white mt-4 text-sm">جاري التحميل...</p></div>

<!-- نافذة منبثقة -->
<div id="modal" class="modal"><div id="modalContent" class="modal-box"></div></div>

<!-- شاشة تسجيل الدخول -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="bg-white rounded-3xl p-8 w-full max-w-md text-center shadow-xl">
        <div class="w-20 h-20 bg-teal-500 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg"><i class="fas fa-piggy-bank text-4xl text-white"></i></div>
        <h1 class="text-2xl font-black mb-2">مدير أموالي</h1>
        <p class="text-gray-500 text-sm mb-6">نظام إدارة مالية متكامل</p>
        <input type="text" id="loginUser" placeholder="اسم المستخدم" class="w-full p-3 border rounded-xl mb-3 focus:outline-none focus:border-teal-500">
        <input type="password" id="loginPass" placeholder="كلمة المرور" class="w-full p-3 border rounded-xl mb-4 focus:outline-none focus:border-teal-500">
        <button onclick="doLogin()" class="w-full bg-teal-500 text-white p-3 rounded-xl font-bold">دخول</button>
        <p id="loginError" class="text-red-500 text-sm mt-3 hidden"></p>
        <p class="text-xs text-gray-400 mt-4">حساب تجريبي: admin / 123</p>
    </div>
</div>

<!-- التطبيق الرئيسي -->
<div id="mainApp" style="display: none; padding-bottom: 90px;">
    
    <!-- الهيدر -->
    <div class="bg-white px-4 py-3 shadow-sm sticky top-0 z-50">
        <div class="flex justify-between items-center max-w-2xl mx-auto">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-teal-100 rounded-full flex items-center justify-center"><i class="fas fa-user text-teal-600"></i></div>
                <div><p class="font-bold" id="userName"></p><p class="text-xs text-teal-600" id="userRole"></p></div>
            </div>
            <div class="flex gap-2">
                <div id="alertIcon" class="hidden w-10 h-10 bg-red-50 rounded-full flex items-center justify-center cursor-pointer" onclick="showBudgetAlerts()"><i class="fas fa-bell text-red-500"></i></div>
                <button onclick="logout()" class="w-10 h-10 bg-gray-100 rounded-full"><i class="fas fa-sign-out-alt text-gray-500"></i></button>
            </div>
        </div>
    </div>

    <!-- المحتوى الرئيسي -->
    <div class="max-w-2xl mx-auto p-4" id="pageContent">
        <!-- سيتم تحميل المحتوى هنا -->
    </div>

    <!-- الشريط السفلي -->
    <div class="bottom-nav">
        <div class="flex justify-around max-w-2xl mx-auto">
            <div onclick="loadPage('home')" class="nav-item" data-page="home"><div class="nav-icon"><i class="fas fa-home"></i></div><span class="text-xs">الرئيسية</span></div>
            <div onclick="loadPage('transactions')" class="nav-item" data-page="transactions"><div class="nav-icon"><i class="fas fa-exchange-alt"></i></div><span class="text-xs">الحركات</span></div>
            <div onclick="loadPage('debts')" class="nav-item admin-only" data-page="debts"><div class="nav-icon"><i class="fas fa-hand-holding-usd"></i></div><span class="text-xs">الديون</span></div>
            <div onclick="loadPage('reports')" class="nav-item admin-only" data-page="reports"><div class="nav-icon"><i class="fas fa-chart-line"></i></div><span class="text-xs">التقارير</span></div>
            <div onclick="loadPage('settings')" class="nav-item admin-only" data-page="settings"><div class="nav-icon"><i class="fas fa-cog"></i></div><span class="text-xs">إعدادات</span></div>
        </div>
    </div>
</div>

<script>
// ============== البيانات والتخزين ==============
let currentUser = null;
let appData = {
    wallets: [{ name: "كاش", balance: 5000 }, { name: "بنك", balance: 10000 }],
    categories: [{ name: "طعام", budget: 1000 }, { name: "مواصلات", budget: 500 }, { name: "فواتير", budget: 800 }],
    transactions: [],
    debts: []
};

let charts = {};

// تحميل البيانات من localStorage
function loadStorage() {
    const saved = localStorage.getItem('financeAppData');
    if (saved) {
        try {
            const data = JSON.parse(saved);
            if (data.wallets) appData.wallets = data.wallets;
            if (data.categories) appData.categories = data.categories;
            if (data.transactions) appData.transactions = data.transactions;
            if (data.debts) appData.debts = data.debts;
        } catch(e) {}
    }
}

function saveStorage() {
    localStorage.setItem('financeAppData', JSON.stringify(appData));
}

// ============== دوال مساعدة ==============
function showLoader(show) {
    document.getElementById('loader').classList.toggle('show', show);
}

function showToast(msg, isError = false) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.style.background = isError ? '#ef4444' : '#0d9488';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
}

function showModal(html) {
    const modal = document.getElementById('modal');
    document.getElementById('modalContent').innerHTML = html;
    modal.classList.add('show');
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
}

// ============== تسجيل الدخول ==============
function doLogin() {
    const user = document.getElementById('loginUser').value;
    const pass = document.getElementById('loginPass').value;
    
    if ((user === 'admin' && pass === '123') || (user === 'user' && pass === '123')) {
        currentUser = { name: user === 'admin' ? 'مدير النظام' : 'مستخدم', role: user === 'admin' ? 'Admin' : 'User' };
        localStorage.setItem('financeUser', JSON.stringify(currentUser));
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        
        // إظهار عناصر الأدمن
        if (currentUser.role !== 'Admin') {
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
        } else {
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'flex');
        }
        
        document.getElementById('userName').innerText = currentUser.name;
        document.getElementById('userRole').innerText = currentUser.role === 'Admin' ? 'مدير' : 'مستخدم';
        
        loadStorage();
        loadPage('home');
    } else {
        const err = document.getElementById('loginError');
        err.innerText = 'بيانات دخول غير صحيحة (admin/123)';
        err.classList.remove('hidden');
        setTimeout(() => err.classList.add('hidden'), 3000);
    }
}

function logout() {
    localStorage.removeItem('financeUser');
    location.reload();
}

// ============== التنقل بين الصفحات ==============
function loadPage(page) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`[data-page="${page}"]`).classList.add('active');
    
    if (page === 'home') renderHome();
    else if (page === 'transactions') renderTransactionsPage();
    else if (page === 'debts') renderDebtsPage();
    else if (page === 'reports') renderReportsPage();
    else if (page === 'settings') renderSettingsPage();
}

// ============== الصفحة الرئيسية ==============
function renderHome() {
    const totalIncome = appData.transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    const totalExpense = appData.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const balance = totalIncome - totalExpense;
    
    // حساب أرصدة المحافظ
    appData.wallets.forEach(w => { w.balance = 5000; }); // قاعدة
        
    const html = `
        <div class="card bg-gradient-to-r from-teal-500 to-teal-600 text-white text-center">
            <p class="text-sm opacity-90">الرصيد الكلي</p>
            <p class="text-4xl font-black">${balance.toLocaleString()} <span class="text-base">ر.س</span></p>
            <div class="flex justify-between mt-4 pt-3 border-t border-white/20">
                <div><p class="text-xs">الإيرادات</p><p class="font-bold">${totalIncome.toLocaleString()}</p></div>
                <div><p class="text-xs">المصروفات</p><p class="font-bold">${totalExpense.toLocaleString()}</p></div>
            </div>
        </div>
        
        <div class="card">
            <h3 class="font-bold mb-3"><i class="fas fa-wallet text-teal-500 ml-2"></i>المحافظ</h3>
            <div class="grid grid-cols-2 gap-2">
                ${appData.wallets.map(w => `<div class="bg-gray-50 p-3 rounded-xl text-center"><p class="font-bold">${w.name}</p><p class="text-teal-600 font-bold">${(w.balance || 0).toLocaleString()}</p></div>`).join('')}
            </div>
        </div>
        
        <div class="card">
            <h3 class="font-bold mb-3"><i class="fas fa-clock text-teal-500 ml-2"></i>آخر الحركات</h3>
            <div class="space-y-2">
                ${appData.transactions.slice(0, 5).map(t => `
                    <div class="flex justify-between items-center p-2 bg-gray-50 rounded-xl">
                        <div><p class="font-bold text-sm">${t.category}</p><p class="text-xs text-gray-500">${t.date}</p></div>
                        <p class="font-bold ${t.type === 'income' ? 'text-green-600' : 'text-red-600'}">${t.type === 'income' ? '+' : '-'} ${t.amount.toLocaleString()}</p>
                    </div>
                `).join('') || '<p class="text-gray-400 text-center py-4">لا توجد حركات</p>'}
            </div>
        </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
}

// ============== صفحة الحركات (مع تعديل وحذف) ==============
function renderTransactionsPage() {
    const html = `
        <div class="card">
            <h3 class="font-bold mb-3">إضافة حركة جديدة</h3>
            <input type="number" id="newAmount" placeholder="المبلغ" class="w-full p-3 border rounded-xl mb-2">
            <div class="flex gap-2 mb-2">
                <button onclick="setTransType('expense')" id="expenseBtn" class="flex-1 p-3 rounded-xl font-bold bg-red-500 text-white">مصروف</button>
                <button onclick="setTransType('income')" id="incomeBtn" class="flex-1 p-3 rounded-xl font-bold bg-gray-200">إيراد</button>
            </div>
            <input type="hidden" id="transType" value="expense">
            <select id="transWallet" class="w-full p-3 border rounded-xl mb-2">${appData.wallets.map(w => `<option>${w.name}</option>`).join('')}</select>
            <select id="transCategory" class="w-full p-3 border rounded-xl mb-2">${appData.categories.map(c => `<option>${c.name}</option>`).join('')}</select>
            <input type="date" id="transDate" class="w-full p-3 border rounded-xl mb-2">
            <textarea id="transNote" rows="2" placeholder="ملاحظات" class="w-full p-3 border rounded-xl mb-2"></textarea>
            <button onclick="addNewTransaction()" class="w-full bg-teal-500 text-white p-3 rounded-xl font-bold">حفظ الحركة</button>
        </div>
        
        <div class="card">
            <h3 class="font-bold mb-3">جميع الحركات</h3>
            <div class="space-y-2 max-h-96 overflow-y-auto" id="transList">
                ${renderTransactionsList()}
            </div>
        </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
    document.getElementById('transDate').valueAsDate = new Date();
}

function renderTransactionsList() {
    if (appData.transactions.length === 0) return '<p class="text-gray-400 text-center py-8">لا توجد حركات</p>';
    
    return [...appData.transactions].reverse().map((t, idx) => `
        <div class="trans-item">
            <div>
                <p class="font-bold">${t.category}</p>
                <p class="text-xs text-gray-500">${t.date} • ${t.wallet || 'كاش'}</p>
                ${t.note ? `<p class="text-xs text-gray-400">${t.note}</p>` : ''}
            </div>
            <div class="flex items-center gap-2">
                <span class="font-bold ${t.type === 'income' ? 'text-green-600' : 'text-red-600'}">${t.type === 'income' ? '+' : '-'} ${t.amount.toLocaleString()}</span>
                <button onclick="editTransaction(${idx})" class="text-blue-500 px-2 py-1"><i class="fas fa-edit"></i></button>
                <button onclick="deleteTransaction(${idx})" class="text-red-500 px-2 py-1"><i class="fas fa-trash"></i></button>
            </div>
        </div>
    `).join('');
}

function setTransType(type) {
    document.getElementById('transType').value = type;
    const expenseBtn = document.getElementById('expenseBtn');
    const incomeBtn = document.getElementById('incomeBtn');
    if (type === 'expense') {
        expenseBtn.className = "flex-1 p-3 rounded-xl font-bold bg-red-500 text-white";
        incomeBtn.className = "flex-1 p-3 rounded-xl font-bold bg-gray-200";
    } else {
        expenseBtn.className = "flex-1 p-3 rounded-xl font-bold bg-gray-200";
        incomeBtn.className = "flex-1 p-3 rounded-xl font-bold bg-green-500 text-white";
    }
}

function addNewTransaction() {
    const amount = parseFloat(document.getElementById('newAmount').value);
    const type = document.getElementById('transType').value;
    const category = document.getElementById('transCategory').value;
    const wallet = document.getElementById('transWallet').value;
    const date = document.getElementById('transDate').value;
    const note = document.getElementById('transNote').value;
    
    if (!amount || amount <= 0) { showToast('أدخل مبلغ صحيح', true); return; }
    if (!category) { showToast('اختر تصنيف', true); return; }
    
    appData.transactions.unshift({
        id: Date.now(),
        amount: amount,
        type: type,
        category: category,
        wallet: wallet,
        date: date,
        note: note,
        createdAt: new Date().toISOString()
    });
    
    saveStorage();
    showToast('تمت الإضافة بنجاح');
    renderTransactionsPage();
    checkBudgetAlerts();
}

function editTransaction(index) {
    const t = appData.transactions[index];
    showModal(`
        <h3 class="font-bold text-lg mb-4">تعديل الحركة</h3>
        <input type="number" id="editAmount" value="${t.amount}" class="w-full p-3 border rounded-xl mb-2">
        <select id="editCategory" class="w-full p-3 border rounded-xl mb-2">${appData.categories.map(c => `<option ${c.name === t.category ? 'selected' : ''}>${c.name}</option>`).join('')}</select>
        <input type="date" id="editDate" value="${t.date}" class="w-full p-3 border rounded-xl mb-2">
        <textarea id="editNote" class="w-full p-3 border rounded-xl mb-3">${t.note || ''}</textarea>
        <button onclick="saveEditTransaction(${index})" class="w-full bg-teal-500 text-white p-3 rounded-xl font-bold">حفظ التعديلات</button>
        <button onclick="closeModal()" class="w-full bg-gray-200 p-3 rounded-xl font-bold mt-2">إلغاء</button>
    `);
}

function saveEditTransaction(index) {
    const amount = parseFloat(document.getElementById('editAmount').value);
    const category = document.getElementById('editCategory').value;
    const date = document.getElementById('editDate').value;
    const note = document.getElementById('editNote').value;
    
    if (!amount || amount <= 0) { showToast('مبلغ غير صحيح', true); return; }
    
    appData.transactions[index].amount = amount;
    appData.transactions[index].category = category;
    appData.transactions[index].date = date;
    appData.transactions[index].note = note;
    
    saveStorage();
    closeModal();
    showToast('تم التعديل بنجاح');
    renderTransactionsPage();
}

function deleteTransaction(index) {
    if (confirm('هل أنت متأكد من حذف هذه الحركة؟')) {
        appData.transactions.splice(index, 1);
        saveStorage();
        showToast('تم الحذف');
        renderTransactionsPage();
    }
}

// ============== إدارة الديون ==============
function renderDebtsPage() {
    const totalDebts = appData.debts.reduce((s, d) => s + d.total, 0);
    const totalPaid = appData.debts.reduce((s, d) => s + d.paid, 0);
    const remaining = totalDebts - totalPaid;
    
    const html = `
        <div class="card">
            <h3 class="font-bold mb-3">تسجيل دين جديد</h3>
            <input type="text" id="debtName" placeholder="اسم الدين" class="w-full p-3 border rounded-xl mb-2">
            <input type="number" id="debtTotal" placeholder="المبلغ الكلي" class="w-full p-3 border rounded-xl mb-2">
            <input type="date" id="debtDue" class="w-full p-3 border rounded-xl mb-2">
            <button onclick="addNewDebt()" class="w-full bg-orange-500 text-white p-3 rounded-xl font-bold">إضافة دين</button>
        </div>
        
        ${appData.debts.length > 0 ? `
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div class="card text-center"><p class="text-sm text-gray-500">إجمالي الديون</p><p class="text-xl font-bold text-orange-600">${totalDebts.toLocaleString()}</p></div>
                <div class="card text-center"><p class="text-sm text-gray-500">المتبقي</p><p class="text-xl font-bold text-red-600">${remaining.toLocaleString()}</p></div>
            </div>
        ` : ''}
        
        <div class="card">
            <h3 class="font-bold mb-3">قائمة الديون</h3>
            <div class="space-y-3">
                ${appData.debts.map((d, idx) => {
                    const remainingAmt = d.total - d.paid;
                    const percent = (d.paid / d.total) * 100;
                    return `
                        <div class="bg-gray-50 p-3 rounded-xl">
                            <div class="flex justify-between items-start mb-2">
                                <div><p class="font-bold">${d.name}</p><p class="text-xs text-gray-500">تاريخ الاستحقاق: ${d.dueDate || 'غير محدد'}</p></div>
                                <div class="flex gap-1">
                                    <button onclick="payDebt(${idx})" class="bg-green-500 text-white px-3 py-1 rounded-lg text-xs">سداد</button>
                                    <button onclick="deleteDebt(${idx})" class="text-red-500 px-2 py-1"><i class="fas fa-trash"></i></button>
                                </div>
                            </div>
                            <div class="flex justify-between text-sm mb-1">
                                <span>المسدد: ${d.paid.toLocaleString()}</span>
                                <span>المتبقي: ${remainingAmt.toLocaleString()}</span>
                            </div>
                            <div class="progress mt-1"><div class="progress-fill" style="width: ${percent}%"></div></div>
                        </div>
                    `;
                }).join('') || '<p class="text-gray-400 text-center py-4">لا توجد ديون</p>'}
            </div>
        </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
}

function addNewDebt() {
    const name = document.getElementById('debtName').value;
    const total = parseFloat(document.getElementById('debtTotal').value);
    const dueDate = document.getElementById('debtDue').value;
    
    if (!name || !total) { showToast('املأ جميع الحقول', true); return; }
    
    appData.debts.push({
        id: Date.now(),
        name: name,
        total: total,
        paid: 0,
        dueDate: dueDate,
        createdAt: new Date().toISOString()
    });
    
    saveStorage();
    showToast('تم إضافة الدين');
    renderDebtsPage();
}

function payDebt(index) {
    const debt = appData.debts[index];
    const remaining = debt.total - debt.paid;
    
    showModal(`
        <h3 class="font-bold text-lg mb-4">سداد دين: ${debt.name}</h3>
        <p class="text-center text-2xl font-bold text-orange-600 mb-4">المتبقي: ${remaining.toLocaleString()} ر.س</p>
        <input type="number" id="payAmount" placeholder="المبلغ المراد سداده" class="w-full p-3 border rounded-xl mb-3">
        <select id="payWallet" class="w-full p-3 border rounded-xl mb-3">${appData.wallets.map(w => `<option>${w.name}</option>`).join('')}</select>
        <button onclick="confirmPayment(${index})" class="w-full bg-teal-500 text-white p-3 rounded-xl font-bold mb-2">تأكيد السداد</button>
        <button onclick="closeModal()" class="w-full bg-gray-200 p-3 rounded-xl font-bold">إلغاء</button>
    `);
}

function confirmPayment(index) {
    const amount = parseFloat(document.getElementById('payAmount').value);
    const wallet = document.getElementById('payWallet').value;
    const debt = appData.debts[index];
    const remaining = debt.total - debt.paid;
    
    if (!amount || amount <= 0) { showToast('أدخل مبلغ صحيح', true); return; }
    if (amount > remaining) { showToast('المبلغ أكبر من المتبقي', true); return; }
    
    // تحديث الدين
    debt.paid += amount;
    
    // تسجيل حركة مصروف
    appData.transactions.unshift({
        id: Date.now(),
        amount: amount,
        type: 'expense',
        category: `سداد دين: ${debt.name}`,
        wallet: wallet,
        date: new Date().toISOString().split('T')[0],
        note: `سداد جزء من دين ${debt.name}`,
        createdAt: new Date().toISOString()
    });
    
    saveStorage();
    closeModal();
    showToast(`تم سداد ${amount.toLocaleString()} ر.س`);
    renderDebtsPage();
    checkBudgetAlerts();
}

function deleteDebt(index) {
    if (confirm('هل أنت متأكد من حذف هذا الدين؟')) {
        appData.debts.splice(index, 1);
        saveStorage();
        showToast('تم الحذف');
        renderDebtsPage();
    }
}

// ============== التقارير المتقدمة ==============
function renderReportsPage() {
    const months = [];
    for (let i = 0; i < 6; i++) {
        const d = new Date();
        d.setMonth(d.getMonth() - i);
        months.push({ value: `${d.getFullYear()}-${d.getMonth() + 1}`, label: d.toLocaleDateString('ar-EG', { month: 'long', year: 'numeric' }) });
    }
    
    const html = `
        <div class="card">
            <h3 class="font-bold mb-3">فلتر التقارير</h3>
            <select id="reportMonthFilter" class="w-full p-3 border rounded-xl mb-2" onchange="updateReports()">
                ${months.map(m => `<option value="${m.value}">${m.label}</option>`).join('')}
            </select>
            <select id="reportCategoryFilter" class="w-full p-3 border rounded-xl mb-2" onchange="updateReports()">
                <option value="">جميع التصنيفات</option>
                ${appData.categories.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}
            </select>
            <button onclick="updateReports()" class="w-full bg-teal-500 text-white p-3 rounded-xl font-bold">تطبيق</button>
        </div>
        
        <div class="grid grid-cols-2 gap-3">
            <div class="card text-center"><p class="text-sm text-gray-500">المصروفات</p><p class="text-xl font-bold text-red-600" id="reportExp">0</p></div>
            <div class="card text-center"><p class="text-sm text-gray-500">الإيرادات</p><p class="text-xl font-bold text-green-600" id="reportInc">0</p></div>
        </div>
        
        <div class="card">
            <h3 class="font-bold mb-3">توزيع المصروفات</h3>
            <div class="chart-container"><canvas id="pieChart"></canvas></div>
        </div>
        
        <div class="card">
            <h3 class="font-bold mb-3">المصروفات الشهرية</h3>
            <div class="chart-container"><canvas id="lineChart"></canvas></div>
        </div>
        
        <div class="card">
            <h3 class="font-bold mb-3">استهلاك الميزانية</h3>
            <div id="budgetBars" class="space-y-3"></div>
        </div>
        
        <button onclick="exportCSV()" class="w-full bg-blue-500 text-white p-3 rounded-xl font-bold"><i class="fas fa-download ml-2"></i>تصدير CSV</button>
    `;
    document.getElementById('pageContent').innerHTML = html;
    updateReports();
}

function updateReports() {
    const monthFilter = document.getElementById('reportMonthFilter')?.value;
    const categoryFilter = document.getElementById('reportCategoryFilter')?.value;
    
    let filtered = [...appData.transactions];
    
    if (monthFilter) {
        const [year, month] = monthFilter.split('-').map(Number);
        filtered = filtered.filter(t => {
            const d = new Date(t.date);
            return d.getFullYear() === year && (d.getMonth() + 1) === month;
        });
    }
    
    if (categoryFilter) {
        filtered = filtered.filter(t => t.category === categoryFilter);
    }
    
    const totalExp = filtered.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
    const totalInc = filtered.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
    
    document.getElementById('reportExp').innerText = totalExp.toLocaleString();
    document.getElementById('reportInc').innerText = totalInc.toLocaleString();
    
    // رسم بياني دائري
    const expByCat = {};
    filtered.filter(t => t.type === 'expense').forEach(t => {
        expByCat[t.category] = (expByCat[t.category] || 0) + t.amount;
    });
    
    const ctxPie = document.getElementById('pieChart')?.getContext('2d');
    if (ctxPie) {
        if (charts.pie) charts.pie.destroy();
        charts.pie = new Chart(ctxPie, {
            type: 'doughnut',
            data: { labels: Object.keys(expByCat), datasets: [{ data: Object.values(expByCat), backgroundColor: ['#0d9488', '#f97316', '#6366f1', '#22c55e', '#ef4444'] }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }
    
    // رسم بياني خطي لآخر 6 أشهر
    const last6Months = [];
    const monthlyData = [];
    for (let i = 5; i >= 0; i--) {
        const d = new Date();
        d.setMonth(d.getMonth() - i);
        last6Months.push(d.toLocaleDateString('ar-EG', { month: 'short' }));
        let exp = 0;
        appData.transactions.forEach(t => {
            const td = new Date(t.date);
            if (td.getFullYear() === d.getFullYear() && td.getMonth() === d.getMonth() && t.type === 'expense') {
                exp += t.amount;
            }
        });
        monthlyData.push(exp);
    }
    
    const ctxLine = document.getElementById('lineChart')?.getContext('2d');
    if (ctxLine) {
        if (charts.line) charts.line.destroy();
        charts.line = new Chart(ctxLine, {
            type: 'line',
            data: { labels: last6Months, datasets: [{ label: 'المصروفات', data: monthlyData, borderColor: '#ef4444', tension: 0.4, fill: true }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
    }
    
    // أشرطة الميزانية
    const budgetHtml = appData.categories.map(c => {
        const spent = expByCat[c.name] || 0;
        const budget = c.budget;
        const percent = budget > 0 ? (spent / budget) * 100 : 0;
        const isOver = spent > budget;
        return `
            <div>
                <div class="flex justify-between text-sm mb-1"><span>${c.name}</span><span>${spent.toLocaleString()} / ${budget.toLocaleString()}</span></div>
                <div class="progress"><div class="progress-fill ${isOver ? 'bg-red-500' : percent > 80 ? 'bg-orange-500' : 'bg-teal-500'}" style="width: ${Math.min(percent, 100)}%"></div></div>
                ${isOver ? `<p class="text-xs text-red-500 mt-1">⚠️ تجاوز بـ ${(spent - budget).toLocaleString()} ر.س</p>` : ''}
            </div>
        `;
    }).join('');
    document.getElementById('budgetBars').innerHTML = budgetHtml || '<p class="text-gray-400">لا توجد بيانات</p>';
}

// ============== الإعدادات ==============
function renderSettingsPage() {
    const html = `
        <div class="card">
            <h3 class="font-bold mb-3">إضافة محفظة</h3>
            <div class="flex gap-2 mb-3"><input type="text" id="newWalletName" placeholder="اسم المحفظة" class="flex-1 p-3 border rounded-xl"><input type="number" id="newWalletBalance" placeholder="الرصيد" class="w-24 p-3 border rounded-xl"></div>
            <button onclick="addWallet()" class="w-full bg-teal-500 text-white p-2 rounded-xl font-bold">إضافة</button>
            <div class="mt-3 space-y-2" id="walletsSettingsList">${renderWalletsSettings()}</div>
        </div>
        
        <div class="card">
            <h3 class="font-bold mb-3">إضافة تصنيف</h3>
            <div class="flex gap-2 mb-3"><input type="text" id="newCatName" placeholder="اسم التصنيف" class="flex-1 p-3 border rounded-xl"><input type="number" id="newCatBudget" placeholder="الميزانية" class="w-24 p-3 border rounded-xl"></div>
            <button onclick="addCategory()" class="w-full bg-purple-500 text-white p-2 rounded-xl font-bold">إضافة</button>
            <div class="mt-3 space-y-2" id="categoriesSettingsList">${renderCategoriesSettings()}</div>
        </div>
        
        <div class="card">
            <h3 class="font-bold mb-3">نسخ احتياطي</h3>
            <button onclick="backupData()" class="w-full bg-blue-500 text-white p-3 rounded-xl font-bold mb-2"><i class="fas fa-download ml-2"></i>تحميل نسخة</button>
            <input type="file" id="restoreFile" class="hidden" accept=".json" onchange="restoreData(this)">
            <button onclick="document.getElementById('restoreFile').click()" class="w-full bg-gray-500 text-white p-3 rounded-xl font-bold"><i class="fas fa-upload ml-2"></i>استعادة نسخة</button>
        </div>
    `;
    document.getElementById('pageContent').innerHTML = html;
}

function renderWalletsSettings() {
    return appData.wallets.map((w, i) => `
        <div class="flex justify-between items-center p-2 bg-gray-50 rounded-xl">
            <span><span class="font-bold">${w.name}</span> <span class="text-gray-500">${w.balance.toLocaleString()}</span></span>
            <div class="flex gap-1">
                <button onclick="editWallet(${i})" class="text-blue-500 px-2"><i class="fas fa-edit"></i></button>
                <button onclick="deleteWallet(${i})" class="text-red-500 px-2"><i class="fas fa-trash"></i></button>
            </div>
        </div>
    `).join('');
}

function renderCategoriesSettings() {
    return appData.categories.map((c, i) => `
        <div class="flex justify-between items-center p-2 bg-gray-50 rounded-xl">
            <span><span class="font-bold">${c.name}</span> <span class="text-gray-500">${c.budget.toLocaleString()}</span></span>
            <div class="flex gap-1">
                <button onclick="editCategory(${i})" class="text-blue-500 px-2"><i class="fas fa-edit"></i></button>
                <button onclick="deleteCategory(${i})" class="text-red-500 px-2"><i class="fas fa-trash"></i></button>
            </div>
        </div>
    `).join('');
}

function addWallet() {
    const name = document.getElementById('newWalletName')?.value;
    const balance = parseFloat(document.getElementById('newWalletBalance')?.value || 0);
    if (!name) { showToast('أدخل اسم المحفظة', true); return; }
    appData.wallets.push({ name: name, balance: balance });
    saveStorage();
    showToast('تمت الإضافة');
    renderSettingsPage();
}

function addCategory() {
    const name = document.getElementById('newCatName')?.value;
    const budget = parseFloat(document.getElementById('newCatBudget')?.value || 0);
    if (!name) { showToast('أدخل اسم التصنيف', true); return; }
    appData.categories.push({ name: name, budget: budget });
    saveStorage();
    showToast('تمت الإضافة');
    renderSettingsPage();
}

function editWallet(idx) {
    const w = appData.wallets[idx];
    const newName = prompt('الاسم الجديد:', w.name);
    const newBalance = prompt('الرصيد الجديد:', w.balance);
    if (newName) w.name = newName;
    if (newBalance && !isNaN(newBalance)) w.balance = parseFloat(newBalance);
    saveStorage();
    renderSettingsPage();
}

function deleteWallet(idx) {
    if (confirm('حذف المحفظة؟')) {
        appData.wallets.splice(idx, 1);
        saveStorage();
        renderSettingsPage();
    }
}

function editCategory(idx) {
    const c = appData.categories[idx];
    const newName = prompt('الاسم الجديد:', c.name);
    const newBudget = prompt('الميزانية الجديدة:', c.budget);
    if (newName) c.name = newName;
    if (newBudget && !isNaN(newBudget)) c.budget = parseFloat(newBudget);
    saveStorage();
    renderSettingsPage();
}

function deleteCategory(idx) {
    if (confirm('حذف التصنيف؟')) {
        appData.categories.splice(idx, 1);
        saveStorage();
        renderSettingsPage();
    }
}

function backupData() {
    const dataStr = JSON.stringify(appData, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('تم تصدير النسخة');
}

function restoreData(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (data.wallets && data.categories && data.transactions) {
                appData = data;
                saveStorage();
                showToast('تمت الاستعادة بنجاح');
                loadPage('home');
            } else {
                showToast('ملف غير صالح', true);
            }
        } catch { showToast('خطأ في الملف', true); }
    };
    reader.readAsText(file);
}

function exportCSV() {
    let csv = "التاريخ,التصنيف,المبلغ,النوع,المحفظة,الملاحظات\n";
    appData.transactions.forEach(t => {
        csv += `${t.date},${t.category},${t.amount},${t.type === 'income' ? 'إيراد' : 'مصروف'},${t.wallet || 'كاش'},${t.note || ''}\n`;
    });
    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `report_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('تم التصدير');
}

// ============== تنبيهات الميزانية ==============
function checkBudgetAlerts() {
    const now = new Date();
    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();
    
    const monthlyExpenses = {};
    appData.transactions.forEach(t => {
        const d = new Date(t.date);
        if (d.getMonth() === currentMonth && d.getFullYear() === currentYear && t.type === 'expense') {
            monthlyExpenses[t.category] = (monthlyExpenses[t.category] || 0) + t.amount;
        }
    });
    
    const alerts = [];
    appData.categories.forEach(c => {
        const spent = monthlyExpenses[c.name] || 0;
        if (c.budget > 0 && spent > c.budget) {
            alerts.push({ name: c.name, spent: spent, budget: c.budget });
        } else if (c.budget > 0 && spent >= c.budget * 0.85) {
            alerts.push({ name: c.name, spent: spent, budget: c.budget, warning: true });
        }
    });
    
    const alertIcon = document.getElementById('alertIcon');
    if (alerts.length > 0) {
        alertIcon.classList.remove('hidden');
        if (alerts.some(a => a.spent > a.budget)) {
            alertIcon.classList.add('bg-red-500', 'text-white');
        }
    } else {
        alertIcon.classList.add('hidden');
    }
}

function showBudgetAlerts() {
    const now = new Date();
    const currentMonth = now.getMonth();
    const currentYear = now.getFullYear();
    
    const monthlyExpenses = {};
    appData.transactions.forEach(t => {
        const d = new Date(t.date);
        if (d.getMonth() === currentMonth && d.getFullYear() === currentYear && t.type === 'expense') {
            monthlyExpenses[t.category] = (monthlyExpenses[t.category] || 0) + t.amount;
        }
    });
    
    const alerts = [];
    appData.categories.forEach(c => {
        const spent = monthlyExpenses[c.name] || 0;
        if (c.budget > 0 && spent > c.budget) {
            alerts.push(`⚠️ ${c.name}: تجاوز بـ ${(spent - c.budget).toLocaleString()} ر.س`);
        } else if (c.budget > 0 && spent >= c.budget * 0.85) {
            alerts.push(`⚠️ ${c.name}: قارب الميزانية (${Math.round((spent/c.budget)*100)}%)`);
        }
    });
    
    if (alerts.length === 0) {
        showToast('لا توجد تنبيهات');
    } else {
        showModal(`<h3 class="font-bold mb-4">تنبيهات الميزانية</h3><div class="space-y-2">${alerts.map(a => `<div class="p-2 bg-red-50 rounded-xl">${a}</div>`).join('')}</div><button onclick="closeModal()" class="w-full bg-gray-200 p-3 rounded-xl mt-4">إغلاق</button>`);
    }
}
